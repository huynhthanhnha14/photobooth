<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PC Builder v9 Fixed</title>
<style>
:root{--bg:#070b12;--bd:rgba(34,211,238,.28);--ac:#22d3ee;--a2:#34d399;--wn:#fbbf24;--dn:#f43f5e;--tx:#e2e8f0;--mt:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;user-select:none}
canvas#scene{display:block;position:fixed;inset:0;z-index:1;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;z-index:10;transition:opacity .3s}
#ui.hidden-ui header,#ui.hidden-ui aside,#ui.hidden-ui footer{opacity:0;pointer-events:none}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:linear-gradient(180deg,rgba(2,6,23,.98),rgba(2,6,23,.78));border-bottom:1px solid var(--bd);backdrop-filter:blur(14px);transition:.3s;pointer-events:auto}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(52,211,153,.12));border:1px solid rgba(34,211,238,.5);display:grid;place-items:center;font-size:20px}
.logo h1{font-size:13px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--ac)}
.logo p{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--mt)}
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;background:rgba(15,23,42,.85);border:1px solid rgba(100,116,139,.3);font-size:12px;font-weight:700}
.stat.score{border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.08);color:#6ee7b7;transition:.3s}
.stat.score b{font-family:ui-monospace,monospace;font-size:15px;font-weight:900}
.tier,.mode-toggle{display:flex;gap:4px;background:rgba(15,23,42,.85);padding:3px;border-radius:9px;border:1px solid rgba(100,116,139,.3)}
.tier button,.mode-toggle button{padding:7px 12px;border:none;background:transparent;color:#64748b;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;cursor:pointer}
.tier button.active{background:linear-gradient(135deg,var(--ac),var(--a2));color:#04121a}
.mode-toggle button.active{background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff}
button.btn{padding:8px 14px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;background:rgba(15,23,42,.85);border:1px solid rgba(100,116,139,.3);color:var(--tx);transition:.18s}
button.btn:hover{border-color:var(--ac);color:var(--ac)}
button.btn.danger:hover{border-color:var(--dn);color:var(--dn)}
button.btn.panel-open{border-color:rgba(167,139,250,.6);background:rgba(167,139,250,.12);color:#c4b5fd}
button.btn.hide-ui{border-color:rgba(34,211,238,.6);background:rgba(34,211,238,.12);color:#a5f3fc}
.main{flex:1;position:relative;min-height:0;display:flex}
.viewport{position:relative;flex:1;min-width:0;pointer-events:none}
.viewport>*{pointer-events:none}
.hint{position:absolute;left:16px;bottom:16px;max-width:420px;padding:12px 16px;border-radius:12px;background:rgba(2,6,23,.88);backdrop-filter:blur(10px);border:1px solid var(--bd);font-size:12px;line-height:1.6;color:#cbd5e1;z-index:5}
.hint b{color:var(--ac);font-size:10px;letter-spacing:.2em;text-transform:uppercase;display:block;margin-bottom:5px}
.hint.danger{border-color:rgba(244,63,94,.5);background:rgba(76,5,25,.85)}
.hint.danger b{color:var(--dn)}
.hint.success{border-color:rgba(52,211,153,.5);background:rgba(6,78,59,.85)}
aside{width:420px;max-width:46vw;background:rgba(2,6,23,.96);backdrop-filter:blur(14px);border-left:1px solid var(--bd);display:flex;flex-direction:column;z-index:8;transition:.3s;pointer-events:auto}
aside .head{padding:14px 16px;border-bottom:1px solid rgba(100,116,139,.2)}
aside .head h2{font-size:10px;font-weight:900;letter-spacing:.25em;text-transform:uppercase;color:#cbd5e1;display:flex;justify-content:space-between;align-items:center}
aside .head h2 span{font-family:ui-monospace,monospace;color:var(--ac)}
aside .body{flex:1;overflow-y:auto;padding:16px}
aside .foot{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(100,116,139,.2)}
aside .foot button{flex:1}
.steps{display:flex;gap:4px;padding:12px 16px;overflow-x:auto;border-bottom:1px solid rgba(100,116,139,.2)}
.step-dot{width:26px;height:26px;flex-shrink:0;display:grid;place-items:center;border-radius:6px;border:1px solid #1e293b;background:rgba(15,23,42,.6);color:#475569;font-size:10px;font-weight:900;cursor:pointer}
.step-dot.done{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.12);color:#6ee7b7}
.step-dot.active{border-color:var(--ac);background:rgba(34,211,238,.18);color:var(--ac)}
.tabs{display:flex;gap:4px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid rgba(100,116,139,.2);background:rgba(15,23,42,.4)}
.tab{padding:7px 10px;border-radius:7px;border:1px solid #1e293b;background:rgba(15,23,42,.6);color:#94a3b8;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
.tab.active{background:linear-gradient(135deg,rgba(167,139,250,.25),rgba(236,72,153,.15));border-color:#a78bfa;color:#c4b5fd}
.tab.done{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.5);color:#6ee7b7}
h3.st{font-size:11px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:#94a3b8;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(100,116,139,.2)}
.picker{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.picker button{padding:12px 14px;text-align:left;border-radius:10px;background:rgba(15,23,42,.7);border:1px solid rgba(100,116,139,.25);color:var(--tx);cursor:pointer;position:relative;transition:.15s}
.picker button:hover{border-color:rgba(34,211,238,.6);transform:translateX(3px)}
.picker button.sel{border-color:#a78bfa;background:rgba(167,139,250,.14)}
.picker button.placed{opacity:.5;border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.08);cursor:default}
.picker .name{font-size:13px;font-weight:800;color:#f1f5f9;margin-bottom:3px}
.picker .spec{font-size:10px;color:var(--mt)}
.picker .check{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;color:#34d399}
.picker .tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:9px;font-weight:900;letter-spacing:.05em;margin-right:5px}
.picker .tag.sk{background:rgba(34,211,238,.15);color:#22d3ee}
.picker .tag.s2{background:rgba(251,191,36,.15);color:#fbbf24}
.picker .tag.s4{background:rgba(52,211,153,.15);color:#34d399}
.action{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:10px;cursor:pointer;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border:1px solid;transition:.15s;margin-bottom:6px;font-family:inherit;color:var(--tx)}
.action.ok{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.12);color:#6ee7b7}
.action.ok:hover{background:rgba(52,211,153,.22)}
.action.warn{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.1);color:#fde68a}
.action.warn:hover{background:rgba(251,191,36,.2)}
.action.danger{border-color:rgba(244,63,94,.6);background:rgba(244,63,94,.1);color:#fda4af}
.action.locked{opacity:.35;cursor:not-allowed;border-color:#334155;background:rgba(30,41,59,.4);color:#64748b}
.action:disabled{opacity:.4;cursor:not-allowed}
.alert{display:flex;gap:8px;padding:12px 14px;border-radius:10px;font-size:12px;line-height:1.6;margin-top:10px;border:1px solid;flex-direction:column;gap:8px;align-items:stretch}
.alert.warn{border-color:rgba(251,191,36,.5);background:rgba(120,53,15,.4);color:#fde68a}
.alert.error{border-color:rgba(244,63,94,.5);background:rgba(76,5,25,.6);color:#fecaca}
.alert.ok{border-color:rgba(52,211,153,.5);background:rgba(6,78,59,.6);color:#bbf7d0}
.alert.info{border-color:rgba(34,211,238,.5);background:rgba(8,145,178,.2);color:#a5f3fc}
.alert .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.fan-picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fan-btn{padding:12px 18px;border-radius:10px;border:1px solid rgba(100,116,139,.3);background:rgba(15,23,42,.7);color:var(--tx);cursor:pointer;font-family:inherit;font-size:14px;font-weight:900;min-width:52px;transition:.15s}
.fan-btn:hover{border-color:var(--ac);color:var(--ac)}
.fan-btn.active{background:linear-gradient(135deg,rgba(34,211,238,.25),rgba(52,211,153,.15));border-color:#22d3ee;color:#fff;box-shadow:0 0 20px -4px rgba(34,211,238,.9)}
.fan-btn.disabled{opacity:.3;cursor:not-allowed}
.sp{margin-bottom:14px}
.sp-tot{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,rgba(15,23,42,.9),rgba(2,6,23,.9));border:2px solid;transition:.3s;box-shadow:0 8px 24px -6px rgba(0,0,0,.6)}
.sp-l{display:flex;flex-direction:column;gap:2px}
.sp-g{font-size:32px;font-weight:900;font-family:ui-monospace,monospace;line-height:1}
.sp-lb{font-size:9px;font-weight:900;letter-spacing:.25em;text-transform:uppercase;opacity:.75}
.sp-r{display:flex;align-items:baseline;gap:6px}
.sp-n{font-size:34px;font-weight:900;font-family:ui-monospace,monospace;line-height:1}
.sp-m{font-size:13px;color:var(--mt);font-weight:700}
.sp-bw{margin-top:8px;margin-bottom:12px}
.sp-bg{height:5px;border-radius:3px;background:#0f172a;overflow:hidden}
.sp-bf{height:100%;border-radius:3px;transition:width .5s ease}
.sp-cs{display:flex;flex-direction:column;gap:8px}
.sp-c{display:flex;flex-direction:column;gap:4px}
.sp-ch{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:800;letter-spacing:.05em;color:#94a3b8}
.sp-cb{height:4px;background:#0f172a;border-radius:2px;overflow:hidden}
.sp-cb>div{height:100%;transition:width .4s ease;border-radius:2px}
.gauge{margin-top:16px;padding:14px;border-radius:10px;background:rgba(15,23,42,.6);border:1px solid rgba(100,116,139,.25)}
.gh{display:flex;justify-content:space-between;margin-bottom:8px;font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#94a3b8}
.gv{font-family:ui-monospace,monospace;font-size:15px}
.gb{height:7px;border-radius:4px;background:#0f172a;overflow:hidden}
.gb>div{height:100%;transition:width .4s;border-radius:4px}
.post{padding:14px;border-radius:10px;margin-top:12px;border:1px solid}
.post.ok{border-color:rgba(52,211,153,.55);background:rgba(6,78,59,.4)}
.post.fail{border-color:rgba(244,63,94,.55);background:rgba(76,5,25,.5)}
.post h4{font-size:12px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
.post.ok h4{color:#6ee7b7}
.post.fail h4{color:#fda4af}
.post p{font-size:12px;line-height:1.6;color:#cbd5e1}
.post .code{font-family:ui-monospace,monospace;font-size:11px;color:#94a3b8;margin-top:8px}
footer{padding:10px 16px;background:linear-gradient(0deg,rgba(2,6,23,.98),rgba(2,6,23,.78));border-top:1px solid var(--bd);backdrop-filter:blur(12px);z-index:12;transition:.3s;pointer-events:auto}
.dw{display:flex;gap:8px;max-width:1600px;margin:0 auto;overflow-x:auto}
.di{flex:1 1 0;min-width:120px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:grab;background:rgba(15,23,42,.7);border:1px solid rgba(100,116,139,.3);text-align:left;transition:.15s}
.di:hover:not(.done):not(.disabled){border-color:rgba(34,211,238,.6);transform:translateY(-2px)}
.di.picked{border-color:var(--ac);background:rgba(34,211,238,.16);box-shadow:0 0 26px -6px rgba(34,211,238,.9);cursor:grabbing}
.di.done{opacity:.5;border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.08);cursor:default}
.di.disabled{opacity:.35;cursor:not-allowed}
.di .ico{width:34px;height:34px;flex-shrink:0;border-radius:8px;background:rgba(2,6,23,.8);border:1px solid rgba(100,116,139,.35);display:grid;place-items:center;font-size:18px}
.di .name{font-size:12px;font-weight:800;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.di .spec{font-size:10px;color:var(--mt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;left:50%;top:82px;transform:translateX(-50%) translateY(-6px);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:100;backdrop-filter:blur(14px);pointer-events:none;opacity:0;transition:all .25s;border:1px solid var(--ac);background:rgba(15,23,42,.97);color:var(--ac)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(6px)}
#toast.error{border-color:var(--dn);color:#fecaca;background:rgba(76,5,25,.97)}
#toast.success{border-color:var(--a2);color:#bbf7d0;background:rgba(6,78,59,.95)}
#toast.warn{border-color:var(--wn);color:#fde68a;background:rgba(69,26,3,.96)}
#restore{position:fixed;top:14px;right:14px;z-index:150;display:none;padding:8px 14px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;background:rgba(15,23,42,.9);border:1px solid var(--ac);color:var(--ac);backdrop-filter:blur(10px)}
#ui.hidden-ui ~ #restore{display:block}
#modal{position:fixed;inset:0;background:rgba(2,6,23,.94);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:200;pointer-events:auto;overflow-y:auto;padding:20px}
#modal.show{display:flex;animation:fi .35s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.mc{width:720px;max-width:96vw;padding:24px;border-radius:18px;background:linear-gradient(160deg,rgba(15,23,42,.98),rgba(2,6,23,.98));border:1px solid rgba(100,116,139,.3);text-align:center;max-height:94vh;overflow-y:auto}
.mc .em{font-size:52px;margin-bottom:10px}
.mc h2{font-size:22px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;color:var(--a2)}
.mc p.sub{font-size:13px;line-height:1.6;color:#94a3b8;margin-bottom:14px}
.pw{position:relative;border-radius:12px;overflow:hidden;border:2px solid rgba(34,211,238,.5);background:linear-gradient(135deg,rgba(15,23,42,.9),rgba(2,6,23,.9));margin:14px 0;box-shadow:0 12px 40px -8px rgba(34,211,238,.4)}
.pw img{display:block;width:100%;height:auto}
.pw .pb{position:absolute;top:10px;left:10px;padding:5px 12px;border-radius:6px;background:rgba(2,6,23,.9);backdrop-filter:blur(10px);border:1px solid rgba(52,211,153,.6);font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:#6ee7b7}
.pw .pt{position:absolute;bottom:10px;right:10px;padding:4px 10px;border-radius:6px;background:rgba(2,6,23,.85);backdrop-filter:blur(10px);font-size:10px;font-family:ui-monospace,monospace;color:#94a3b8;border:1px solid rgba(100,116,139,.3)}
.bc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;text-align:left}
.cr{padding:10px 12px;border-radius:8px;background:rgba(15,23,42,.7);border:1px solid rgba(100,116,139,.25);font-size:11px}
.cr .k{color:var(--mt);font-size:9px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;margin-bottom:3px}
.cr .v{color:#f1f5f9;font-weight:700;font-size:12px}
.cr .br{color:var(--ac);font-size:10px;font-weight:800;letter-spacing:.05em;margin-top:2px}
.mst{display:flex;justify-content:center;gap:16px;align-items:center;margin:16px 0}
.mg{font-size:52px;font-weight:900;font-family:ui-monospace,monospace;line-height:1;text-shadow:0 0 24px currentColor}
.ms{font-size:34px;font-weight:900;font-family:ui-monospace,monospace;line-height:1}
.pa{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.pa button{padding:10px 20px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:9px;cursor:pointer;background:linear-gradient(135deg,rgba(34,211,238,.15),rgba(52,211,153,.15));border:1px solid rgba(34,211,238,.5);color:#a5f3fc;transition:.18s;font-family:inherit}
.pa button:hover{background:linear-gradient(135deg,rgba(34,211,238,.3),rgba(52,211,153,.25));border-color:#22d3ee;color:#fff}
.br2{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.mc button{padding:12px 24px;font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--a2));border:none;color:#04121a;font-family:inherit}
.mc button.gh{background:rgba(15,23,42,.9);border:1px solid rgba(100,116,139,.4);color:var(--tx)}
.mc button.gh:hover{border-color:var(--ac);color:var(--ac)}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--bg);z-index:300;transition:opacity .5s}
#loading.hide{opacity:0;pointer-events:none}
.spin{width:56px;height:56px;border-radius:50%;border:3px solid #0f172a;border-top-color:var(--ac);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loading p{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ac)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:9999px}
@media(max-width:1100px){aside{width:360px}.bc{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="ui">
<header>
<div class="logo"><div class="logo-mark">🖥️</div><div><h1>PC Builder</h1><p>v9 · Fixed Edition</p></div></div>
<div class="stats">
<div class="mode-toggle" id="mt"><button data-mode="guided" class="active">🎯 Hướng dẫn</button><button data-mode="free">🎨 Tự do</button></div>
<div class="tier" id="ts"><button data-tier="easy">DỄ</button><button data-tier="medium" class="active">VỪA</button><button data-tier="high">CAO</button></div>
<button class="btn panel-open" id="ui-panel">🔓 Mở nắp</button>
<button class="btn hide-ui" id="ui-hide">👁 Ẩn UI</button>
<div class="stat score">🏆 <b id="ui-score">0</b></div>
<button class="btn danger" id="ui-reset">↻ Reset</button>
</div>
</header>
<div class="main">
<div class="viewport" id="viewport">
<div class="hint" id="ui-hint"><b id="ui-hint-title">Hướng dẫn</b><span id="ui-hint-text">Chọn Case ở panel phải để bắt đầu.</span></div>
</div>
<aside><div class="head"><h2 id="ui-panel-title">Build Panel <span id="ui-step-num">1/11</span></h2></div><div id="ui-panel-dynamic"></div></aside>
</div>
<footer><div class="dw" id="ui-dock"></div></footer>
</div>
<button id="restore">👁 Hiện UI (ESC)</button>
<div id="toast"></div>
<div id="modal"><div class="mc" id="mc"><div class="em" id="mem">🎉</div><h2 id="mtitle">Build hoàn tất!</h2><p class="sub" id="mtext"></p><div class="pw" id="mpw" style="display:none"><img id="mphoto" alt="PC Build"/><div class="pb">📸 Ảnh PC đã build</div><div class="pt" id="mptime">--:--</div></div><div id="msw"></div><div class="bc" id="mcfg"></div><div class="br2" id="mbr"><button id="mbtn" class="gh">↻ Chơi lại</button></div></div></div>
<div id="loading"><div class="spin"></div><p>Đang tải 3D…</p></div>

<script type="importmap">
{"imports":{"three":"https://esm.sh/three@0.160.0?bundle","three/addons/":"https://esm.sh/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
const loadingEl=document.getElementById('loading');
let THREE,OrbitControls;
try{THREE=await import('three');OrbitControls=(await import('three/addons/controls/OrbitControls.js')).OrbitControls}catch(e){loadingEl.innerHTML='<p style="color:#f43f5e">❌ Lỗi CDN</p>';throw e}

class AudioEngine{
constructor(){this.ctx=null;this.master=null;this.noise=null;this.fan=null}
get context(){if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=.7;this.master.connect(this.ctx.destination)}if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx}
getNoise(c){if(this.noise)return this.noise;const len=Math.floor(c.sampleRate*1.5);const b=c.createBuffer(1,len,c.sampleRate);const d=b.getChannelData(0);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.03*w)/1.03;d[i]=last*3.2}this.noise=b;return b}
unlock(){void this.context}
click(){const c=this.context;if(!c)return;const t=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(440,t+.05);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.08);o.connect(g).connect(this.master);o.start(t);o.stop(t+.1)}
snap(){const c=this.context;if(!c)return;const t=c.currentTime;const n=c.createBufferSource();n.buffer=this.getNoise(c);const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2400;const ng=c.createGain();ng.gain.setValueAtTime(.4,t);ng.gain.exponentialRampToValueAtTime(.0001,t+.08);n.connect(bp).connect(ng).connect(this.master);n.start(t);n.stop(t+.1);const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(80,t+.1);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g).connect(this.master);o.start(t);o.stop(t+.2)}
paste(){const c=this.context;if(!c)return;const t=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(600,t+.15);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g).connect(this.master);o.start(t);o.stop(t+.3)}
error(){const c=this.context;if(!c)return;const t0=c.currentTime;[0,.2].forEach((off,i)=>{const t=t0+off,o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(i===0?160:130,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.01);g.gain.setValueAtTime(.12,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+.17);o.connect(g).connect(this.master);o.start(t);o.stop(t+.19)})}
crack(){const c=this.context;if(!c)return;const t=c.currentTime;const n=c.createBufferSource();n.buffer=this.getNoise(c);const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=1400;const ng=c.createGain();ng.gain.setValueAtTime(.5,t);ng.gain.exponentialRampToValueAtTime(.0001,t+.35);n.connect(hp).connect(ng).connect(this.master);n.start(t);n.stop(t+.4);const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(50,t+.35);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(g).connect(this.master);o.start(t);o.stop(t+.42)}
plug(){const c=this.context;if(!c)return;const t=c.currentTime;const n=c.createBufferSource();n.buffer=this.getNoise(c);const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1600;const ng=c.createGain();ng.gain.setValueAtTime(.3,t);ng.gain.exponentialRampToValueAtTime(.0001,t+.1);n.connect(bp).connect(ng).connect(this.master);n.start(t);n.stop(t+.12)}
playBeeps(ms){const c=this.context;if(!c)return;let cur=c.currentTime+.1;ms.forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=1046;g.gain.setValueAtTime(.0001,cur);g.gain.exponentialRampToValueAtTime(.12,cur+.01);g.gain.setValueAtTime(.12,cur+d/1000-.02);g.gain.exponentialRampToValueAtTime(.0001,cur+d/1000);o.connect(g).connect(this.master);o.start(cur);o.stop(cur+d/1000+.05);cur+=d/1000+.08})}
powerOn(){const c=this.context;if(!c)return;const t=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(1400,t);o.frequency.exponentialRampToValueAtTime(280,t+.05);g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.0001,t+.08);o.connect(g).connect(this.master);o.start(t);o.stop(t+.1);[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o2=c.createOscillator(),g2=c.createGain(),st=t+.5+i*.1;o2.type='sine';o2.frequency.value=f;g2.gain.setValueAtTime(.0001,st);g2.gain.exponentialRampToValueAtTime(.1,st+.04);g2.gain.exponentialRampToValueAtTime(.0001,st+.75);o2.connect(g2).connect(this.master);o2.start(st);o2.stop(st+.8)})}
startFan(){const c=this.context;if(!c||this.fan)return;const src=c.createBufferSource();src.buffer=this.getNoise(c);src.loop=true;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=500;const g=c.createGain();g.gain.setValueAtTime(.0001,c.currentTime);g.gain.linearRampToValueAtTime(.1,c.currentTime+1.4);src.connect(f).connect(g).connect(this.master);src.start();this.fan={src,g}}
stopFan(){const c=this.context;if(!c||!this.fan)return;const now=c.currentTime;this.fan.g.gain.cancelScheduledValues(now);this.fan.g.gain.setValueAtTime(this.fan.g.gain.value,now);this.fan.g.gain.linearRampToValueAtTime(.0001,now+.8);try{this.fan.src.stop(now+1)}catch{};this.fan=null}}

function getRamSlotIds(){const mb=state.selection.mainboard;const n=mb?.slots||4;return Array.from({length:n},(_,i)=>`ram${i+1}`)}
function getRamSlotCount(){return state.selection.mainboard?.slots||4}
function getRamFilledCount(){return getRamSlotIds().filter(id=>state.slots[id]).length}
function getAllRamFilled(){return getRamSlotIds().every(id=>state.slots[id])}
function getRamNeededCount(){return getRamSlotCount()}
function getMaxFans(){return state.selection.pcCase?.maxFans||0}

function checkCompatibility(){const s=state.selection;const f=[];
if(s.pcCase&&s.mainboard&&!s.pcCase.ff.includes(s.mainboard.ff))f.push({sev:'fatal',msg:`Case không hỗ trợ ${s.mainboard.ff}.`});
if(s.mainboard&&s.cpu&&s.mainboard.socket!==s.cpu.socket)f.push({sev:'fatal',msg:`Socket ${s.mainboard.socket} ≠ ${s.cpu.socket}.`});
if(s.ram&&s.mainboard&&s.ram.type!==s.mainboard.mem)f.push({sev:'fatal',msg:`RAM ${s.ram.type} không vừa ${s.mainboard.mem}.`});
if(s.gpu&&s.pcCase&&s.gpu.len>s.pcCase.maxGpu)f.push({sev:'fatal',msg:`GPU ${s.gpu.len}mm > ${s.pcCase.maxGpu}mm.`});
if(s.cooler&&s.pcCase&&s.cooler.height>s.pcCase.maxCooler)f.push({sev:'fatal',msg:`Tản ${s.cooler.height}mm > ${s.pcCase.maxCooler}mm.`});
if(s.psu&&s.cpu&&s.gpu&&s.psu.wattage<s.cpu.tdp+s.gpu.tdp+150)f.push({sev:'fatal',msg:`PSU ${s.psu.wattage}W không đủ.`});
const bn=bottleneck();if(bn>25&&s.cpu&&s.gpu)f.push({sev:'warning',msg:`Nghẽn cổ chai ~${bn}%.`});
return f}
function bottleneck(){const s=state.selection;if(!s.cpu||!s.gpu)return 0;return Math.min(70,Math.round(Math.abs(s.cpu.gaming-s.gpu.gaming)*1.2))}
function getGrade(score){
if(score>=950)return{letter:'S+',label:'PERFECT',color:'#fbbf24'};
if(score>=880)return{letter:'S',label:'EXCELLENT',color:'#a78bfa'};
if(score>=780)return{letter:'A',label:'GREAT',color:'#22d3ee'};
if(score>=680)return{letter:'B',label:'GOOD',color:'#34d399'};
if(score>=550)return{letter:'C',label:'FAIR',color:'#94a3b8'};
if(score>=400)return{letter:'D',label:'POOR',color:'#f97316'};
return{letter:'F',label:'FAILED',color:'#f43f5e'}}

function computeScore(){
const bd={assembly:0,performance:0,balance:0,thermal:0,power:0,speed:0};
const s=state.selection;
const ramCount=getRamFilledCount();
const ramNeed=getRamNeededCount();
const maxFans=getMaxFans();
const fanBonus=(maxFans>0)?Math.min(1,state.fanCount/maxFans):0;
const totalSlots=7+ramNeed-2;
const filled=(state.selection.mainboard?1:0)+(state.slots.cpu?1:0)+ramCount+(state.slots.m2?1:0)+(state.slots.pcie?1:0)+(state.slots.psu?1:0);
const base=Math.round((filled/totalSlots)*200);
let bonus=0;
if(state.slots.paste)bonus+=15;
if(state.slots.cooler)bonus+=20;
if(state.cables.atx24)bonus+=5;
if(state.cables.eps)bonus+=5;
if(!s.gpu?.power||state.cables.pcie)bonus+=5;
if(s.cpu&&s.mainboard&&s.cpu.socket===s.mainboard.socket)bonus+=15;
if(fanBonus>=1)bonus+=10;else if(fanBonus>0)bonus+=Math.round(fanBonus*10);
bd.assembly=Math.min(250,base+bonus);
if(s.cpu&&s.gpu){
const combined=(s.cpu.gaming+s.gpu.gaming)/2;
let rb=0;
if(s.ram){rb+=s.ram.type==='DDR5'?10:s.ram.type==='DDR4'?5:0;rb+=s.ram.speedMHz>=6000?5:s.ram.speedMHz>=3000?3:0}
if(ramCount===ramNeed)rb+=5;
let sb=0;
if(s.storage)sb+=s.storage.type==='M.2-NVMe'?8:s.storage.type==='SATA-SSD'?4:0;
bd.performance=Math.min(250,Math.round(combined*2.2+rb+sb));
}else bd.performance=Math.round((filled/totalSlots)*50);
const bn=bottleneck();
bd.balance=bn<=5?150:bn<=10?135:bn<=15?110:bn<=20?80:bn<=30?40:bn<=40?15:0;
if(s.cooler&&s.cpu){
const cpuTdp=s.cpu.tdp;
const coolerTdp=s.cooler.tdp||(s.cooler.type==='stock'?65:150);
const hr=coolerTdp/cpuTdp;
if(hr>=2)bd.thermal=150;else if(hr>=1.6)bd.thermal=135;else if(hr>=1.3)bd.thermal=110;
else if(hr>=1.1)bd.thermal=80;else if(hr>=0.9)bd.thermal=40;else bd.thermal=0;
if(!state.slots.paste)bd.thermal=Math.round(bd.thermal*.5);
if(!state.slots.cooler)bd.thermal=0;
bd.thermal=Math.round(bd.thermal*(0.75+0.25*fanBonus))}
if(s.psu&&s.cpu&&s.gpu){
const req=s.cpu.tdp+s.gpu.tdp+120;
const ratio=s.psu.wattage/req;
let es=0;
if(ratio>=1.4&&ratio<=1.8)es=70;else if(ratio>=1.2&&ratio<1.4)es=55;
else if(ratio>1.8&&ratio<=2.2)es=50;else if(ratio>=1.0&&ratio<1.2)es=35;
else if(ratio<1.0)es=0;else es=25;
const em={'80+ White':5,'80+ Bronze':10,'80+ Gold':18,'80+ Platinum':24,'80+ Titanium':30};
es+=em[s.psu.eff]||0;
bd.power=Math.min(100,es)
}else bd.power=Math.round((state.cables.atx24?15:0)+(state.cables.eps?10:0));
const errors=state.faults.length;
if(filled===totalSlots&&state.slots.paste&&state.slots.cooler&&errors===0)bd.speed=100;
else bd.speed=Math.max(0,Math.round((filled/totalSlots)*60-errors*15+(state.slots.paste?15:0)+(state.slots.cooler?15:0)));
const faults=checkCompatibility();
const fatal=faults.find(x=>x.sev==='fatal');
const penalty=faults.reduce((a,x)=>a+(x.sev==='fatal'?150:20),0);
const raw=bd.assembly+bd.performance+bd.balance+bd.thermal+bd.power+bd.speed;
const final=fatal?0:Math.max(0,Math.min(1000,raw-penalty));
state.faults=faults;state.breakdown=bd;state.score=final;
const el=document.getElementById('ui-score');
el.textContent=final;
const g=getGrade(final);
el.style.color=g.color;el.style.textShadow=`0 0 12px ${g.color}88`;
}

function runPOST(){
const s=state.selection;let r;
if(!s.mainboard)r={ok:false,beeps:[600,200],code:'1 long 1 short',msg:'Chưa chọn mainboard!'};
else if(!state.slots.cpu)r={ok:false,beeps:[200,200,200,200,200],code:'5 short',msg:'Không có CPU.'};
else if(s.cpu&&s.mainboard&&s.cpu.socket!==s.mainboard.socket)r={ok:false,beeps:[600,200],code:'1 long 1 short',msg:'CPU không khớp socket!'};
else if(!state.slots.paste)r={ok:false,beeps:[1200],code:'1 long',msg:'Chưa chét keo!'};
else if(!state.slots.cooler)r={ok:false,beeps:[1200],code:'1 long',msg:'Chưa gắn tản!'};
else if(!getAllRamFilled())r={ok:false,beeps:[200,200,200],code:'3 short',msg:`Thiếu RAM (${getRamFilledCount()}/${getRamNeededCount()} khe).`};
else if(!state.slots.m2)r={ok:false,beeps:[600,200,200,200],code:'1 long 3 short',msg:'Không có ổ cứng.'};
else if(!state.slots.pcie&&s.cpu&&!s.cpu.igpu)r={ok:false,beeps:[600,200,200],code:'1 long 2 short',msg:'Không có GPU.'};
else if(!state.slots.psu)r={ok:false,beeps:[],code:'No beep',msg:'Không có nguồn.'};
else if(state.fanCount===0)r={ok:false,beeps:[800,200],code:'1 long 1 short',msg:'Không có quạt case — bí nhiệt!'};
else if(!state.cables.atx24||!state.cables.eps)r={ok:false,beeps:[800,200,800,200,800],code:'Continuous',msg:'Thiếu dây nguồn.'};
else r={ok:true,beeps:[180],code:'1 short',msg:'✅ POST passed!'};
audio.playBeeps(r.beeps);state.postResult=r;return r}

function buildFan(radius,hueOffset,direction){
const g=new THREE.Group();
const fs=radius*2+.15,thick=.1,fh=.16;
g.add(bx(fs,thick,fh,M.fanFrame,0,radius+.02,0));
g.add(bx(fs,thick,fh,M.fanFrame,0,-radius-.02,0));
g.add(bx(thick,fs,fh,M.fanFrame,-radius-.02,0,0));
g.add(bx(thick,fs,fh,M.fanFrame,radius+.02,0,0));
[[-radius-.02,radius+.02],[radius+.02,radius+.02],[-radius-.02,-radius-.02],[radius+.02,-radius-.02]].forEach(p=>{
const sc=cy(.045,.04,M.black,p[0],p[1],0,10);sc.rotation.x=Math.PI/2;g.add(sc)});
const hub=cy(radius*.28,.1,M.fanHub,0,0,0,20);hub.rotation.x=Math.PI/2;g.add(hub);
const blades=new THREE.Group();
const bc=9;
const tiltDir=direction==='exhaust'?1:-1;
for(let i=0;i<bc;i++){
const a=(i/bc)*Math.PI*2;
const bs=new THREE.Shape();
bs.moveTo(0,0);
bs.bezierCurveTo(radius*.25,radius*.05,radius*.35,radius*.2,radius*.3,radius*.35);
bs.bezierCurveTo(radius*.25,radius*.35,radius*.15,radius*.3,0,radius*.15);
bs.lineTo(0,0);
const bgeo=new THREE.ExtrudeGeometry(bs,{depth:0.025,bevelEnabled:false});
const b=new THREE.Mesh(bgeo,M.fanBlade);
b.rotation.z=a+tiltDir*0.4;
b.position.set(Math.cos(a)*radius*.15,Math.sin(a)*radius*.15,0);
b.castShadow=false;blades.add(b)}
g.add(blades);
g.userData.blades=blades;
const ledMat=makeLED(hueOffset);
const lr=new THREE.Mesh(new THREE.TorusGeometry(radius+.02,.04,8,32),ledMat);
lr.raycast=noRay;g.add(lr);
for(let i=0;i<4;i++){
const a=(i/4)*Math.PI*2+Math.PI/4;
const dot=new THREE.Mesh(new THREE.SphereGeometry(.05,8,8),ledMat);
dot.position.set(Math.cos(a)*(radius+.02),Math.sin(a)*(radius+.02),0);
dot.raycast=noRay;g.add(dot)}
const am=direction==='intake'?M.arrowIntake:M.arrowExhaust;
for(let i=0;i<3;i++){
const s=new THREE.Shape();
s.moveTo(0,.10);s.lineTo(.07,-.06);s.lineTo(-.07,-.06);s.closePath();
const geo=new THREE.ShapeGeometry(s);
const ar=new THREE.Mesh(geo,am);
ar.position.set(-radius*.6+i*radius*.6,radius+.02,fh/2+.015);
if(direction==='intake')ar.rotation.z=Math.PI;
ar.raycast=noRay;g.add(ar)}
g.userData.direction=direction;
return g}

const slots3D={},labels3D={};
function clearSlotObjects(){
Object.values(slots3D).forEach(s=>{
if(s.hit){s.hit.geometry.dispose();scene.remove(s.hit)}
if(s.glow){s.glow.geometry.dispose();scene.remove(s.glow)}});
Object.values(labels3D).forEach(l=>l.remove());
Object.keys(slots3D).forEach(k=>delete slots3D[k]);

function getSlotInfo(){
const n=getRamSlotCount();
const ramZs=n===2?[0.55,1.05]:[0.35,0.60,0.85,1.10];
const info={
cpu:{pos:[CPU_MESH_X,CPU_Y,CPU_Z],size:[.5,1.05,1.05],label:'CPU SOCKET',step:'cpu',accepts:'cpu'},
paste:{pos:[CPU_MESH_X,CPU_Y,CPU_Z],size:[.35,.85,.85],label:'CHÉT KEO',step:'paste',accepts:'paste'},

m2:{pos:[MB_X-.10,MB_Y-0.05,CPU_Z],size:[.40,.32,1.65],label:'M.2 NVMe',step:'storage',accepts:'ssd'},
pcie:{pos:[MB_X-.20,MB_Y-1.15,0.0],size:[.40,.22,2.65],label:'PCIe x16',step:'gpu',accepts:'gpu'},
psu:{pos:[-0.3,-CASE_H/2+0.75,CASE_D/2-1.0],size:[2.4,1.4,1.9],label:'PSU BAY',step:'psu',accepts:'psu'}};
ramZs.forEach((z,i)=>{info[`ram${i+1}`]={pos:[MB_X-.20,MB_Y,z],size:[.35,2.05,.16],label:`RAM ${i+1}`,step:'ram',accepts:'ram'}});
return info}
function buildSlots(){
clearSlotObjects();
const SI=getSlotInfo();
const cache={};
Object.entries(SI).forEach(([id,info])=>{
const key=info.size.join('_');
if(!cache[key])cache[key]=new THREE.BoxGeometry(...info.size);
const hit=new THREE.Mesh(cache[key],new THREE.MeshBasicMaterial({color:0x34d399,transparent:true,opacity:0,depthWrite:false}));
hit.position.set(...info.pos);hit.userData={slotId:id};scene.add(hit);
const gg=new THREE.BoxGeometry(info.size[0]*1.1,info.size[1]*1.1,info.size[2]*1.1);
const glow=new THREE.Mesh(gg,new THREE.MeshBasicMaterial({color:0x6ee7b7,wireframe:true,transparent:true,opacity:0,depthWrite:false}));
glow.position.copy(hit.position);glow.raycast=noRay;scene.add(glow);
slots3D[id]={hit,glow,info};
const lbl=document.createElement('div');
lbl.style.cssText='position:absolute;padding:4px 10px;border-radius:6px;background:rgba(2,6,23,.9);border:1px solid #22d3ee;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#22d3ee;pointer-events:none;white-space:nowrap;transform:translate(-50%,-50%);transition:opacity .2s;opacity:0;z-index:4';
lbl.textContent=info.label;
document.getElementById('viewport').appendChild(lbl);
labels3D[id]=lbl})}

function findNearestSlot(pos,maxDist=1.8){
const pid=state.pickedPartId;
if(!pid)return null;
const acc={cpu:'cpu',paste:'paste',ram:'ram',ssd:'ssd',gpu:'gpu',psu:'psu',cooler:'cooler'};
const acc2=acc[pid];
const ai=getActiveSlotIds().filter(id=>!state.slots[id]&&slots3D[id]);
const SI=getSlotInfo();
let best=null,bestD=maxDist;
ai.forEach(sid=>{
const info=SI[sid];
if(!info)return;
if(info.accepts!==acc2)return;
const sp=new THREE.Vector3(...info.pos);
const d=pos.distanceTo(sp);
if(d<bestD){bestD=d;best=sid}});
return best}

function pickerHTML(items,selectedId,specFn){
return items.map(it=>{
const sel=selectedId===it.id?'sel':'';
return `<button class="${sel}" data-id="${it.id}">
<div class="name">${it.name}</div><div class="spec">${specFn(it)}</div></button>`}).join('')}
function bindPicker(sel,items,cb){
document.querySelectorAll(sel).forEach(btn=>{
btn.addEventListener('click',()=>{audio.click();const it=items.find(x=>x.id===btn.dataset.id);if(it)cb(it)})})}

function handlePower(){
if(state.powered){state.powered=false;audio.stopFan();audio.click();innerLight.intensity=0;renderUI();return}
const r=runPOST();
state.powered=true;
if(r.ok){audio.powerOn();audio.startFan();innerLight.intensity=15;setTimeout(showVictory,2400)}
else{audio.error();document.getElementById('ui').animate(
[{transform:'translate(0,0)'},{transform:'translate(-8px,4px)'},{transform:'translate(8px,-4px)'},
{transform:'translate(-6px,-3px)'},{transform:'translate(6px,3px)'},{transform:'translate(0,0)'}],
{duration:500,easing:'ease-out'})}
renderUI()}

if(state.slots[id]){label.style.opacity='0';return}
if(id==='paste'&&!state.slots.cpu){label.style.opacity='0';return}
if(id==='cooler'&&(!state.slots.cpu||!state.slots.paste)){label.style.opacity='0';return}
if(!state.selection.mainboard&&id!=='psu'){label.style.opacity='0';return}
const ia=as.includes(id);
if(!ia){label.style.opacity='0';return}
_v.set(info.pos[0],info.pos[1]+(id==='cooler'?1.0:0.7),info.pos[2]);_v.project(camera);
const x=(_v.x*.5+.5)*canvas.clientWidth;
const y=(-_v.y*.5+.5)*canvas.clientHeight;
if(_v.z>1){label.style.opacity='0';return}
label.style.opacity='1';label.style.left=x+'px';label.style.top=y+'px';
label.textContent=info.label;
label.style.borderColor='#22d3ee';label.style.color='#22d3ee'})}

const clock=new THREE.Clock();
let fanSpeed=0,hueShift=0,panelCurrentRot=0;
function animate(){
requestAnimationFrame(animate);
const delta=Math.min(clock.getDelta(),.05);
const t=clock.getElapsedTime();
const tr=state.panelOpen?-Math.PI*.7:0;
panelCurrentRot+=(tr-panelCurrentRot)*Math.min(1,delta*4);
if(panelPivot)panelPivot.rotation.y=panelCurrentRot;
const step=STEPS[state.currentStep];
const as=state.mode==='guided'?({
cpu:['cpu'],paste:['paste'],ram:getRamSlotIds(),storage:['m2'],cooler:['cooler'],gpu:['pcie'],psu:['psu'],fans:[]
}[step]||[]):['cpu','paste',...getRamSlotIds(),'m2','pcie','psu','cooler'];
Object.entries(slots3D).forEach(([id,s])=>{
if(state.slots[id]){s.glow.material.opacity=0;s.hit.material.opacity=0;return}
if(id==='paste'&&!state.slots.cpu){s.glow.material.opacity=0;s.hit.material.opacity=0;return}
if(id==='cooler'&&(!state.slots.cpu||!state.slots.paste)){s.glow.material.opacity=0;s.hit.material.opacity=0;return}
if(!state.selection.mainboard&&id!=='psu'){s.glow.material.opacity=0;s.hit.material.opacity=0;return}
if(as.includes(id)){
s.glow.material.opacity=.5+.35*Math.sin(t*4);
s.hit.material.opacity=.08}
else{s.glow.material.opacity=0;s.hit.material.opacity=0}});
const tf=state.powered?1:0;
fanSpeed+=(tf-fanSpeed)*Math.min(1,delta*1.5);
spinningFans.forEach(f=>{if(f.group)f.group.rotation.z+=delta*f.maxSpeed*fanSpeed*3});
if(state.powered)hueShift=(hueShift+delta*.2)%1;
else hueShift=(hueShift+delta*.02)%1;
ledMats.forEach(({mat,hue})=>{
if(state.powered){const h=(hueShift+hue)%1;const c=new THREE.Color().setHSL(h,1,.6);mat.color.copy(c)}
else{const c=new THREE.Color().setHSL(hue,.5,.1);mat.color.copy(c)}});
if(camTween&&!userInteracting){
const k=Math.min(1,(performance.now()-camTween.startTime)/camTween.duration);
const e=1-Math.pow(1-k,3);
camera.position.lerpVectors(camTween.startPos,camTween.endPos,e);
controls.target.lerpVectors(camTween.startTarget,camTween.endTarget,e);
if(k>=1)camTween=null}
controls.update();updateLabels();renderer.render(scene,camera)}

buildCase();buildMotherboard();buildSlots();buildCaseFans();
renderInstalledParts();computeScore();renderUI();animate();

setTimeout(()=>{
loadingEl.classList.add('hide');
setTimeout(()=>{loadingEl.style.display='none'},600);
showToast('success','👋 Chọn Case ở panel phải để bắt đầu.');
},400);
</script>
</body>
</html>
