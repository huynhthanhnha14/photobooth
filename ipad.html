<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📱 Chuyển hướng...</title>
  <style>
    body {
      background: #0a1628;
      color: #38bdf8;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .msg { max-width: 400px; }
    h1 { color: #fbbf24; font-size: 24px; margin-bottom: 12px; }
    p { font-size: 14px; line-height: 1.6; opacity: 0.9; }
    code {
      background: rgba(6, 182, 212, 0.2);
      padding: 3px 8px;
      border-radius: 4px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="msg">
    <h1>⚠️ Đã thay đổi cách kết nối</h1>
    <p>
      iPad giờ dùng <code>index.html</code> trực tiếp.<br>
      Vui lòng mở URL có dạng:<br>
      <code>index.html?room=XXXXXX</code>
    </p>
    <p id="redirect-info" style="margin-top: 20px; font-size: 12px; opacity: 0.6;"></p>
  </div>
  <script>
    // Nếu có ?room=XXXX thì tự chuyển
    const params = new URLSearchParams(location.search);
    const room = params.get('room');
    if (room) {
      document.getElementById('redirect-info').textContent = 'Đang chuyển hướng...';
      location.href = 'index.html?room=' + encodeURIComponent(room);
    }
  </script>
</body>
</html>
